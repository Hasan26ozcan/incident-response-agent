[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-response-agent"
version = "0.1.0"
description = "Agentic incident response system — 23-stage portfolio project"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "bandit>=1.9",
    "mypy>=2.3",
    "pytest>=9",
    "pytest-cov>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/incident_agent"]

[tool.ruff]
exclude = [".venv", ".pytest_cache", "__pycache__", "data/generated", "eval/results"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C4", "UP"]
ignore = [
    "C408",  # dict() calls are intentional for keyword-arg readability in scenario definitions
    "UP017",  # timezone.utc is more readable than datetime.UTC
    "UP042",  # str, Enum is intentional for Pydantic compatibility
]

[tool.ruff.lint.per-file-ignores]
"data/generate_dataset.py" = ["E501", "C408"]
"src/incident_agent/prompts/few_shot.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
strict = false

[tool.bandit]
exclude = [".venv", "__pycache__", ".pytest_cache"]
