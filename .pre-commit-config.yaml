# Optional but recommended: `pip install pre-commit && pre-commit install`
# to run these on every commit. Kept deliberately light (fast hooks only —
# ruff, not mypy/bandit/pytest) so it doesn't slow down commits; the full
# suite still runs in CI (.github/workflows/ci.yml) and via `make ci`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-json
        exclude: ^data/incidents/.*\.json$  # generated; validated by eval/validate_dataset.py instead
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
