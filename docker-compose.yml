version: "3.8"

services:
  incident-response:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-response-agent
    working_dir: /app
    volumes:
      - .:/app
      - .venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m pytest tests/ -v
    stdin_open: true
    tty: true

  # Optional: run quality checks
  quality:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ira-quality
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "ruff check . && ruff format --check . && mypy . --ignore-missing-imports && bandit -c bandit.yml -r src && pytest --cov=incident_agent --cov-report=term-missing && python3 eval/validate_dataset.py"
    stdin_open: true
    tty: true
