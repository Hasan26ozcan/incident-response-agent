# SonarCloud / SonarQube. Run: set SONAR_TOKEN, then `sonar-scanner` (or the GitHub workflow). Never put the token here.
sonar.projectKey=Hasan26ozcan_incident-response-agent
sonar.projectName=incident-response-agent
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/__pycache__/**,data/**,eval/results/**,.cache/**
# the fixtures are fake credentials and hostile strings on purpose (attack suite, redaction tests)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S6418
sonar.issue.ignore.multicriteria.e2.resourceKey=**/security/attacks.py
