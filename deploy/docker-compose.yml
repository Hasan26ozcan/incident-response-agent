# Shadow-mode service. Secrets come from your local .env (never committed): GROQ_API_KEY, optional SLACK_WEBHOOK_URL.
# The port is published on loopback only; put TLS (a reverse proxy) in front of it before exposing it anywhere else.
services:
  incident-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    command: ["--mode", "shadow"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["agent-state:/state"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  agent-state:
